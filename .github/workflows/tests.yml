name: tests

on:
  push:
    branches: [main]
  pull_request:

# Once the repository is public anyone can open a pull request, and every job here
# only ever reads the checkout.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # aiohttp is a Home Assistant dependency rather than one of ours, but the
      # tests import the api module directly, so it is needed here.
      - run: pip install pytest aiohttp ruff
      - run: python -m ruff check custom_components/ tests/ tests_ha/ scripts/
      - run: python -m ruff format --check custom_components/ tests/ tests_ha/ scripts/
      - run: python -m pytest tests/ -v

  config-flow-tests:
    # The Home Assistant test harness does not work on Windows, so these run only
    # here. Python 3.13 to get the newest harness pip will resolve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      # Run from inside tests_ha so its own pytest.ini applies. The root config
      # disables the Home Assistant plugin, which these tests require.
      - run: python -m pytest . -v
        working-directory: tests_ha

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    # Informational until the repository is public. The action reads the files
    # through the GitHub API rather than from the checkout, and on a private
    # repository that read comes back empty: integration_manifest fails with
    # "expected a dictionary. Got None" and hacsjson calls a valid file invalid.
    # Every check that needs only repository metadata - brands, topics,
    # description, license, archived, issues, information - already passes, so
    # drop this line once the repository is public and the last two should pass
    # too. The brands check is satisfied by the icons in brand/, so nothing here
    # is waiting on an upstream pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
