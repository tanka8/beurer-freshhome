name: tests

on:
  push:
    branches: [main]
  pull_request:

# Once the repository is public anyone can open a pull request, and every job here
# only ever reads the checkout.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # aiohttp is a Home Assistant dependency rather than one of ours, but the
      # tests import the api module directly, so it is needed here.
      - run: pip install pytest aiohttp ruff
      - run: python -m ruff check custom_components/ tests/ tests_ha/ scripts/
      - run: python -m ruff format --check custom_components/ tests/ tests_ha/ scripts/
      - run: python -m pytest tests/ -v

  config-flow-tests:
    # The Home Assistant test harness does not work on Windows, so these run only
    # here. Python 3.13 to get the newest harness pip will resolve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      # Run from inside tests_ha so its own pytest.ini applies. The root config
      # disables the Home Assistant plugin, which these tests require.
      - run: python -m pytest . -v
        working-directory: tests_ha

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit rather than a tag on purpose. This check is blocking, so
      # an unpinned @main lets an upstream change fail our builds - but hacs/action
      # has not cut a tag since 22.5.0 in May 2022, and pinning to that would run
      # validation rules four years out of date. The commit is main as of
      # 2026-06-08; Dependabot bumps it like any other action.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
