name: tests

on:
  push:
    branches: [main]
  pull_request:

# Once the repository is public anyone can open a pull request, and every job here
# only ever reads the checkout.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # aiohttp is a Home Assistant dependency rather than one of ours, but the
      # tests import the api module directly, so it is needed here.
      - run: pip install pytest aiohttp ruff
      - run: python -m ruff check custom_components/ tests/ tests_ha/ scripts/
      # --diff prints what would change, so a failure says what to fix rather than
      # only naming the file.
      - run: python -m ruff format --check --diff custom_components/ tests/ tests_ha/ scripts/
      - run: python -m pytest tests/ -v

  config-flow-tests:
    # The Home Assistant test harness does not work on Windows, so these run only
    # here. Python 3.14 because pytest-homeassistant-custom-component 0.13.317 and
    # later require it: on 3.13 pip silently resolved 0.13.316 (Home Assistant
    # 2026.2.3) instead of the current release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The floor is the release this was written against (0.13.373, Home Assistant
      # 2026.10.2). If the Python version here ever stops satisfying the harness,
      # pip fails on it instead of quietly falling back to an old release.
      - run: pip install "pytest-homeassistant-custom-component>=0.13.373"
      # So the version under test is visible in the log.
      - name: show the resolved Home Assistant versions
        run: |
          python --version
          pip list --format=freeze | grep -i -E '^(homeassistant|pytest-homeassistant-custom-component|voluptuous)=='
      # Run from inside tests_ha so its own pytest.ini applies. The root config
      # disables the Home Assistant plugin, which these tests require.
      - run: python -m pytest . -v
        working-directory: tests_ha

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit rather than @master, for the same reason as hacs/action
      # below: a mutable ref lets an upstream push change what runs in our CI.
      # home-assistant/actions has only a 1.0.0 tag, from 2020 and 165 commits
      # behind, and documents @master as the way to use it - so, as with hacs/action,
      # a tag is not an option. The commit is master as of 2026-10-17; Dependabot's
      # github-actions ecosystem (.github/dependabot.yml) scans this file.
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit rather than a tag on purpose. This check is blocking, so
      # an unpinned @main lets an upstream change fail our builds - but hacs/action
      # has not cut a tag since 22.5.0 in May 2022, and pinning to that would run
      # validation rules four years out of date. The commit is main as of
      # 2026-06-08; Dependabot bumps it like any other action.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
