name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # aiohttp is a Home Assistant dependency rather than one of ours, but the
      # tests import the api module directly, so it is needed here.
      - run: pip install pytest aiohttp
      - run: python -m pytest tests/ -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    # Informational only. Several of its checks cannot pass yet: brands requires
    # being listed in home-assistant/brands, and while this repository is private
    # the action cannot read manifest.json or hacs.json to validate them. Make this
    # blocking once the repository is public and brands are submitted.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
