name: Unsupported or misbehaving model
description: Your Beurer device is not an LR-500, some entities are wrong, or you want to confirm a model works
labels: ["model-support"]
body:
  - type: markdown
    attributes:
      value: |
        Before you start: this is a hobby project with **no promise of support**, and
        it talks to an undocumented API that Beurer can break at any time. Issues are
        welcome and read, but a reply is a favour rather than a commitment.
  - type: markdown
    attributes:
      value: |
        This integration was reverse engineered against an **LR-500**. Other models
        report different fields and speed ranges, so the most useful thing you can
        attach is the raw status frame.
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: "LR 501"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Settings → Devices & services → Beurer FreshHome → the three dots →
        Download diagnostics. Device ids and your email are already redacted.
      render: json
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      description: >
        A model that works as it is can be added to the "Supported models" table in
        the README - say so here and it will be.
      options:
        - Everything matches the app
        - Some entities or controls are wrong or missing
        - Nothing works
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you checked, or what is wrong
      description: >
        Which entities and controls you compared with the app. For anything wrong:
        which entity, what it shows, and what the app shows instead.
    validations:
      required: true
