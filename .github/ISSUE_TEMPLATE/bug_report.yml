name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before you start: this is a hobby project with **no promise of support**, and
        it talks to an undocumented API that Beurer can break at any time. Issues are
        welcome and read, but a reply is a favour rather than a commitment.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        Settings → System → Logs, filtered to beurer_freshhome. Please check for
        anything that looks like a token before pasting.
      render: shell
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
